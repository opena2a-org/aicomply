name: ML-DSA-44 Verify Benchmark

# AIComply only verifies ML-DSA-44 (sign happens in hackmyagent). This bench
# protects the verify-side budget (D17: verify p99 < 1.5ms). Sign-side is
# covered by hackmyagent's own workflow of the same name.

on:
  pull_request:
    paths:
      - 'src/arp/**'
      - 'scripts/bench-ml-dsa-44.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run verify benchmark
        run: node scripts/bench-ml-dsa-44.mjs | tee bench-output.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-dsa-44-verify-bench-${{ github.run_id }}
          path: bench-output.txt
          retention-days: 90
