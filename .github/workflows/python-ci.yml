name: Python CI

# Lint + type-check + test the Python port, and run the CROSS-LANGUAGE PARITY
# GATE: the Python comply() must reproduce the TS-produced golden in
# bench/baseline.json against the shared bench/corpus. A TS pattern/threshold
# change that updates baseline.json will fail this job unless the Python port is
# updated in lockstep (org Registry-change-propagation discipline).

on:
  pull_request:
    branches:
      - main
    paths:
      - 'python/**'
      - 'bench/**'        # shared golden corpus + baseline drive parity
      - 'src/**'          # a TS pattern change must update Python in the same PR
      - 'pack/**'         # shared pattern pack + conformance corpus
      - '.github/workflows/python-ci.yml'
  push:
    branches:
      - main

jobs:
  test:
    name: Lint, type-check, test, parity
    # pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build (2026-11-04)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        # 3.12 installs the langchain extra so the LangChain adapter tests run;
        # 3.9 keeps it out so the "langchain-core not installed" path stays tested.
        include:
          - python-version: '3.9'
            extras: 'dev'
          - python-version: '3.12'
            extras: 'dev,langchain'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + ${{ matrix.extras }} extras)
        run: pip install -e '.[${{ matrix.extras }}]'

      - name: Ruff
        run: ruff check src tests bench

      - name: Mypy
        run: mypy src/aicomply --ignore-missing-imports

      - name: Pytest (includes parity gate)
        run: python -m pytest -q

      - name: Cross-language parity harness vs TS baseline
        run: python bench/measure.py
