name: Release (Python / PyPI)

# Publishes the `aicomply` Python package to PyPI via Trusted Publishing (OIDC).
# Triggered by pushing a python-v* tag (e.g. python-v0.1.0). No PyPI API token is
# used - PyPI exchanges GitHub's OIDC token for short-lived publish credentials,
# and the publish action attaches PEP 740 attestations automatically.
#
# Unlike npm, PyPI supports a "pending publisher" so the FIRST version can publish
# via OIDC with no manual bootstrap. One-time setup on pypi.org BEFORE the first
# tag push:
#   Account -> Publishing -> Add a new pending publisher
#     PyPI Project Name:   aicomply
#     Owner:               opena2a-org
#     Repository name:     aicomply
#     Workflow name:       release-python.yml
#     Environment name:    (blank)

# The tag push is the ONLY trigger. `workflow_dispatch` was removed 2026-08-18:
# a publish trigger that is not the tag push means the release gate does not stand
# in front of the publish at all -- anyone with write access could publish from any
# branch state without cutting a tag, and this job holds `id-token: write`.
on:
  push:
    tags:
      - 'python-v*'

jobs:
  publish:
    name: Build, test, publish to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
      contents: write   # required to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (editable + dev tools + build)
        run: |
          pip install -e '.[dev]'
          pip install build

      - name: Lint + type-check + test (incl. parity gate)
        run: |
          ruff check src tests bench
          mypy src/aicomply --ignore-missing-imports
          python -m pytest -q
          python bench/measure.py

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing + attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # attestations default to true; PEP 740 provenance is attached via OIDC.

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
