[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicomply"
version = "0.2.0"
description = "Inline PII, credential, and regulated-data classifier for AI agent I/O. Dual-layer: deterministic regex + optional semantic Guard. Library + CLI. Python port of @opena2a/aicomply."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "OpenA2A" }]
keywords = [
  "pii",
  "pii-detection",
  "compliance",
  "redaction",
  "credentials",
  "secret-detection",
  "data-loss-prevention",
  "dlp",
  "llm",
  "llm-security",
  "ai-agent",
  "ai-safety",
  "prompt-injection",
  "guardrails",
  "langchain",
  "hipaa",
  "pci",
  "gdpr",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/opena2a-org/aicomply"
Repository = "https://github.com/opena2a-org/aicomply"
Issues = "https://github.com/opena2a-org/aicomply/issues"

[project.scripts]
aicomply = "aicomply.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aicomply"]

[tool.hatch.build.targets.sdist]
include = ["src/aicomply", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
